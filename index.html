<link href="style.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<div class="container">
    <div class="row">
        <div class="col">
            <div>
                <h1 class="text-success mt-4">Crud App...</h1>
                <input class="form form-control w-25 mt-4" placeholder="Search" id="search" />
            </div>
            <div>
                <button type="button" class="btn btn-primary mt-4" data-bs-toggle="modal"
                    data-bs-target="#exampleModal">
                    ADD
                </button>

                <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                    aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalLabel">Car Form</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form id="carForm">
                                    <label><input class="form form-control" placeholder="Brand"
                                            id="carBrand" /></label><br><br>
                                    <label><input class="form form-control" placeholder="Image"
                                            id="carImage" /></label><br><br>
                                    <label><input class="form form-control" placeholder="Price"
                                            id="carPrice" /></label><br><br>
                                    <label><input class="form form-control" placeholder="qty"
                                            id="carQty" /></label><br><br>
                                    <button type="submit" class="btn btn-success">Submit</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
            <div>
                <table class="table table-hover text-center table-striped mt-4">
                    <thead>
                        <tr>
                            <th>s:no</th>
                            <th>brand</th>
                            <th>image</th>
                            <th>price</th>
                            <th>qty</th>
                            <th>total</th>
                            <th>edit</th>
                            <th>delete</th>
                        </tr>
                    </thead>
                    <tbody id="root">

                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4"></td>
                            <td>GrandTotal</td>
                            <td id="total">0000</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>



<script src="crud.js"></script>

    crossorigin="anonymous"></script>
